# SPDX-License-Identifier: MPL-2.0
# Runs the same gate as local development: tools/verify.ps1.
# After it is stable, make "Verify gate (ubuntu-latest)" and "Verify gate (windows-latest)"
# required checks on main.
name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # D17: build/test on linux-x64 and win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history for the secret scan and whitespace diff

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # OS-independent scans run once, on Linux
      - name: Install gitleaks and reuse
        if: runner.os == 'Linux'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          pipx install reuse

      - name: Verify (Linux)
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./tools/verify.ps1

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/verify.ps1 -Skip secret-scan,license-headers
