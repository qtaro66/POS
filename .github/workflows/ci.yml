name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore POS.slnx
      - name: Build
        run: dotnet build POS.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test POS.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace
        run: git diff --check origin/main...HEAD
      - name: Reject runtime and secret files
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(node_modules|bin|obj|data|backups|logs|secrets)(/|$)|\.(db|db-wal|db-shm|sqlite|sqlite3|pfx|p12|key|pem)$'
          if git ls-files | grep -E "$forbidden"; then
            echo "Forbidden runtime or secret-like files are tracked."
            exit 1
          fi
