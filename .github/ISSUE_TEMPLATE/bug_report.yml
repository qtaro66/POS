name: Bug report
description: Report reproducible incorrect behavior without including sensitive production data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach credentials, customer data, private certificates, databases, or unredacted hardware identifiers.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Branch API
        - Central API
        - PC POS
        - Mobile PWA
        - Back Office
        - Printing
        - Deployment
        - Documentation
    validations:
      required: true
